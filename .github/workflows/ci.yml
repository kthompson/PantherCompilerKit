name: ci
on:
    pull_request:
    workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: pncs compile
      run: sbt pncs/compile

    - name: test
      run: sbt test/test

  pnc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    # Fail on diagnostics and require the compiler to emit itself identically.
    # Stage 3 uses a separate JVM capped at 4 GiB (build.sbt).
    - name: Verify self-hosting fixed point
      run: sbt -J-Xmx1G pnc/compile stage3/run

  transpile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: pncs transpile
        run: |
          sbt pncs/transpile
          # Stage everything first: a bare `git diff` ignores untracked files,
          # so a newly generated .pn would slip through, and deletions of
          # stale generated files would too.
          git add -A
          git diff --cached --exit-code || (echo "Transpilation changed pnc/src, please commit the result." && exit 1)

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      # Picks up tools/doccheck/baseline.txt automatically. The baseline is
      # empty, so this fails on any doc snippet that produces a diagnostic.
      - name: doc code blocks
        run: sbt "doccheck/run docs/language docs/architecture"

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir docs install --frozen-lockfile

      # VitePress fails the build on dead links.
      - name: Build site
        run: pnpm --dir docs build

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup SBT
      uses: sbt/setup-sbt@v1

    - name: scalafmt
      run: sbt scalafmtCheckAll
